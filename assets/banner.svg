<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#101c38" />
      <stop offset="100%" stop-color="#070c18" />
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Card Background Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
    }
    .badge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #e2e8f0;
    }
    .subbadge-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 11px;
      fill: #38bdf8;
    }

    /* Dynamic subtle background flow elements */
    @keyframes float1 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(-12px) scale(1.02); }
    }
    @keyframes float2 {
      0%, 100% { transform: translateY(0px) scale(1); }
      50% { transform: translateY(10px) scale(0.98); }
    }
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.25; }
      50% { opacity: 0.65; }
    }
    @keyframes dashCycle {
      to { stroke-dashoffset: -100; }
    }

    .floating-card-1 {
      animation: float1 7s ease-in-out infinite;
    }
    .floating-card-2 {
      animation: float2 9s ease-in-out infinite;
    }
    .pulsing-glow {
      animation: pulseGlow 5s ease-in-out infinite;
    }
    .connecting-flow {
      stroke-dasharray: 8, 8;
      animation: dashCycle 20s linear infinite;
    }
  </style>

  <!-- Background Canvas -->
  <rect width="1200" height="360" fill="url(#bg-grad)" rx="16" />

  <!-- Background Decorative Grid Pattern -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="250" y1="0" x2="250" y2="360" />
    <line x1="400" y1="0" x2="400" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="850" y1="0" x2="850" y2="360" />
    <line x1="1000" y1="0" x2="1000" y2="360" />
    <line x1="1150" y1="0" x2="1150" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Glowing Mesh Spheres in Background (Non-obstructive) -->
  <circle cx="200" cy="80" r="140" fill="#38bdf8" filter="url(#glow)" class="pulsing-glow" />
  <circle cx="1020" cy="270" r="160" fill="#818cf8" filter="url(#glow)" class="pulsing-glow" style="animation-delay: 2.5s;" />

  <!-- Animated Background Flow Connection -->
  <path d="M 120 280 C 350 320, 600 240, 850 290 S 1100 270, 1150 250" fill="none" stroke="url(#accent-grad)" stroke-width="2" opacity="0.4" class="connecting-flow" />

  <!-- DYNAMIC PILL CARDS AT BOTTOM (Under title & subtitle to maintain foreground clarity) -->
  <g class="floating-card-1">
    <!-- Card 1: Portfolio Governance -->
    <rect x="80" y="240" width="220" height="64" rx="12" fill="url(#card-grad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="112" cy="272" r="16" fill="#0284c7" fill-opacity="0.3" />
    <text x="112" y="278" font-size="16" text-anchor="middle">🏛️</text>
    <text x="140" y="265" class="badge-text">Portfolio Governance</text>
    <text x="140" y="283" class="subbadge-text">STRATEGIC ALIGNMENT</text>
  </g>

  <g class="floating-card-2">
    <!-- Card 2: PPM & OKRs -->
    <rect x="330" y="240" width="220" height="64" rx="12" fill="url(#card-grad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="362" cy="272" r="16" fill="#4f46e5" fill-opacity="0.3" />
    <text x="362" y="278" font-size="16" text-anchor="middle">🎯</text>
    <text x="390" y="265" class="badge-text">Enterprise PPM</text>
    <text x="390" y="283" class="subbadge-text">OKR CASCADING</text>
  </g>

  <g class="floating-card-1" style="animation-delay: 1.5s;">
    <!-- Card 3: Process Intelligence -->
    <rect x="580" y="240" width="230" height="64" rx="12" fill="url(#card-grad)" stroke="#c084fc" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="612" cy="272" r="16" fill="#9333ea" fill-opacity="0.3" />
    <text x="612" y="278" font-size="16" text-anchor="middle">⚙️</text>
    <text x="640" y="265" class="badge-text">Process Intelligence</text>
    <text x="640" y="283" class="subbadge-text">MINING &amp; AUTOMATION</text>
  </g>

  <g class="floating-card-2" style="animation-delay: 2s;">
    <!-- Card 4: Open-Source PMO -->
    <rect x="840" y="240" width="230" height="64" rx="12" fill="url(#card-grad)" stroke="#34d399" stroke-width="1.2" stroke-opacity="0.4" />
    <circle cx="872" cy="272" r="16" fill="#059669" fill-opacity="0.3" />
    <text x="872" y="278" font-size="16" text-anchor="middle">🔓</text>
    <text x="900" y="265" class="badge-text">Open-Source PMO</text>
    <text x="900" y="283" class="subbadge-text" fill="#34d399">DATA SOVEREIGNTY</text>
  </g>

  <!-- FOREGROUND PRIMARY HEADINGS (Clean, crisp, unobstructed) -->
  <g transform="translate(80, 0)">
    <!-- Category Pill Tag -->
    <rect x="0" y="48" width="310" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
    <text x="14" y="67" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM DIRECTORY</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="125" class="title">
      Awesome Center of Excellence Management <tspan fill="url(#accent-grad)">🏛️</tspan>
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="165" class="subtitle">
      Enterprise PPM Suites, PMO Governance Platforms &amp; Self-Hosted Open-Source Frameworks
    </text>

    <!-- Decorative Accent Bar -->
    <rect x="0" y="188" width="120" height="4" rx="2" fill="url(#accent-grad)" />
  </g>
</svg>
